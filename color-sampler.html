<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Sampler</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="color-sampler.css">
</head>
<body>
  <header>
    <h1>Color Sampler</h1>
    <p>Import an image to extract its color palette</p>
  </header>

  <main>
    <!-- Zone 1: Import -->
    <section id="drop-zone" class="drop-zone">
      <div class="drop-zone-content">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <path d="m21 15-5-5L5 21"/>
        </svg>
        <p class="drop-zone-label">Drag &amp; drop an image here</p>
        <p class="drop-zone-or">or</p>
        <button id="file-btn" class="btn">Choose File</button>
      </div>
      <input type="file" id="file-input" accept="image/*" hidden>
      <p id="drop-zone-error" class="drop-zone-error" hidden></p>
    </section>

    <!-- Two-column workspace -->
    <div id="workspace" class="workspace" hidden>
      <!-- Left: Image display + eyedropper -->
      <section id="image-section" class="image-section">
        <div class="image-toolbar">
          <button id="new-image-btn" class="btn btn-small">New Image</button>
        </div>
        <div class="image-container" id="image-container">
          <canvas id="image-canvas"></canvas>
          <div id="loupe" class="loupe" hidden>
            <canvas id="loupe-canvas" width="120" height="120"></canvas>
          </div>
        </div>
        <p class="hint">Click anywhere on the image to pick a color</p>
      </section>

      <!-- Right: Results -->
      <section id="results" class="results"></section>
    </div>

    <!-- Hidden canvas for downsampled analysis -->
    <canvas id="analysis-canvas" hidden></canvas>
  </main>

  <!-- Toast -->
  <div id="toast" class="toast" role="status" aria-live="polite" hidden>Copied!</div>

  <script src="color-sampler.js"></script>
</body>
</html>
